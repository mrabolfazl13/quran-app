[package]
name = "quran-desktop"
version = "0.1.0"
description = "Offline Quran learning, understanding, tafsir and hifz platform (desktop shell)"
authors = ["Quran Platform"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "quran_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
