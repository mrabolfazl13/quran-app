<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>قرآن — خواندن، فهمیدن، حفظ</title>
    <!-- The theme and direction are applied from <html> attributes before React
         mounts, so a dark-mode or English-preference user never sees a flash of
         the default light/RTL shell. -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('quran.theme');
          if (!theme) theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          var lang = localStorage.getItem('quran.uiLang') || 'fa';
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'fa' || lang === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>این برنامه برای اجرای آفلاین به JavaScript نیاز دارد.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
